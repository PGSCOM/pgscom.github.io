  <g mask="url(#hueco)"><rect x="7.6" y="1.6" width="8" height="10" rx="1.4" fill="white" transform="rotate(-12 11.6 6.6)"/></g>
  <use href="#bolsa" fill="white" mask="url(#costuras)"/>
</svg>
